[package]
name = "seedgrid_engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ingrid_core = { path = "vendor/ingrid_core" }
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
instant = { version = "0.1.12", features = ["wasm-bindgen"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
